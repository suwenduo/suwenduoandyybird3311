let callAudio=null,callTimers=[],callSession=0,callStartedAt=0,callVoiceReady=null,callWaiters=[];
const callVoiceURLs=[1,2,3].map(i=>`assets/emergency-voice-${i}.wav`);
function prepareCallVoices(context){return Promise.all(callVoiceURLs.map(async url=>{const response=await fetch(url);if(!response.ok)throw new Error("Voice unavailable");return context.decodeAudioData(await response.arrayBuffer());}));}

 if(AudioEngine){
  try{
   const context=new AudioEngine();callAudio=context;await context.resume();callVoiceReady=prepareCallVoices(context);callVoiceReady.catch(()=>{});
   if(session!==callSession)return;

   for(let i=0;i<3;i++){

  if(session!==callSession)return;

async function queueCallDialogue(session){

    const source=callAudio.createBufferSource();source.buffer=buffers[index];source.connect(callAudio.destination);

   }catch(error){

 return comments.flatMap((row, index) => {
  const shared = nmUpdatedStory.find(message => message.kind === row.track && message.type === 'song');
  const [,month,day,hour,minute] = shared.date.match(/(\d+)月(\d+)日\s+(\d+):(\d+)/);
  const commentTime = Date.UTC(2026, Number(month)-1, Number(day), Number(hour), Number(minute)+5);
  return nmLikeOffsets[index].map((offset, liker) => ({
   row, commentTime, time:commentTime+offset*60000,

  }));
 }).sort((a,b) => b.time-a.time);
}

<script>
const wcHistorySources = new Map([
 [wcHainanGroup, wcHainanMessages],
 [wcCrewGroup, [...wcCrewSchedule, ...wcWrapMessages]],
 [wcFamilyGroup, wcFamilyMessages],
 [wcBowenContact, wcBowenMessages],
 [wcHenryContact, wcHenryMessages],
 [wcLuluContact, wcLuluMessages],

 [wc77Contact, wc77Messages]
]);

const wcChatActivity=new Map();
let wcActivitySequence=0;
function wcRecordActivity(contact){
 wcChatActivity.set(contact,{
  time:Date.UTC(2026,10,7,0,storyClockMinute),
  sequence:++wcActivitySequence
 });
}
function wcHistoryTimestamp(messages){
 let year=2026,month=1,day=1,time=0;
 for(const message of messages){
  if(!message.stamp)continue;
  const stamp=message.stamp.normalize('NFKC');
  const date=stamp.match(/(?:(\d{4})年)?(\d+)月(\d+)[日号]?/);
  if(date){year=Number(date[1]||2026);month=Number(date[2]);day=Number(date[3]);}
  const clock=stamp.match(/(\d{1,2}):(\d{2})/);
  if(date||clock)time=Date.UTC(year,month-1,day,Number(clock?.[1]||0),Number(clock?.[2]||0));
 }
 return time;
}
function wcSortedChats(query=''){
 return wcContacts.map((contact,index)=>{
  const activity=wcChatActivity.get(contact);
  const history=contact.name==='🐷'?pigHistory:wcHistorySources.get(contact)||[];
  return {contact,index,time:activity?.time??wcHistoryTimestamp(history),sequence:activity?.sequence||0};
 }).sort((a,b)=>{
  if(!!a.contact.pinned!==!!b.contact.pinned)return a.contact.pinned?-1:1;
  if(a.contact.pinned)return a.index-b.index;
  return b.time-a.time || b.sequence-a.sequence || a.index-b.index;
 }).map(row=>row.contact).filter(contact=>contact.name.toLowerCase().includes(query.toLowerCase()));
}

<script>
let messageSoundContext=null;
async function prepareMessageSound(){
 try{
  const AudioEngine=window.AudioContext||window.webkitAudioContext;
  if(!AudioEngine)return null;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch{}
  if(!messageSoundContext||messageSoundContext.state==='closed')messageSoundContext=new AudioEngine();
  if(messageSoundContext.state!=='running')await messageSoundContext.resume();
  return messageSoundContext;
 }catch{return null;}
}
async function playMessageSound(){
 const context=await prepareMessageSound();
 if(!context || context.state!=='running')return;
 const start=context.currentTime;
 [[880,0],[1174.66,.09]].forEach(([frequency,delay])=>{
  const oscillator=context.createOscillator();
  const gain=context.createGain();
  const time=start+delay;
  oscillator.type='sine';
  oscillator.frequency.value=frequency;
  gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(.065,time+.012);
  gain.gain.exponentialRampToValueAtTime(.001,time+.17);
  oscillator.connect(gain);
  gain.connect(context.destination);
  oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
  oscillator.start(time);
  oscillator.stop(time+.18);
 });
}
document.addEventListener('pointerdown',prepareMessageSound,{capture:true});
document.addEventListener('touchend',prepareMessageSound,{passive:true});

const storyClockStages = {
 initial:{minute:23*60+48, ceiling:23*60+49, tickMs:25000},
 unlocked:{minute:23*60+50, ceiling:23*60+52, tickMs:20000},
 conversationComplete:{minute:23*60+53, ceiling:23*60+53, tickMs:10000},
 musicNotified:{minute:23*60+54, ceiling:23*60+54, tickMs:30000},
 musicOpened:{minute:23*60+54, ceiling:23*60+57, tickMs:30000},
 smsArrived:{minute:23*60+57, ceiling:23*60+57, tickMs:20000},
 smsExchange:{minute:23*60+58, ceiling:23*60+58, tickMs:20000},
 smsReveal:{minute:23*60+59, ceiling:23*60+59, tickMs:20000},
 midnight:{minute:24*60, ceiling:24*60, tickMs:20000},
 wishSent:{minute:24*60, ceiling:24*60+2, tickMs:2000},
 ownerThanks:{minute:24*60+3, ceiling:24*60+3, tickMs:20000},
 finalWechat:{minute:24*60+4, ceiling:24*60+4, tickMs:20000}
};
let storyClockStage='initial';
let storyClockMinute=storyClockStages.initial.minute;
let storyClockChangedAt=performance.now();
let storyClockStarted=false;
function startStoryClock(){
 if(storyClockStarted)return;
 storyClockStarted=true;
 storyClockChangedAt=performance.now();
}
function paintStoryClock(){
 const time=String(Math.floor(storyClockMinute/60)%24).padStart(2,'0')+':'+String(storyClockMinute%60).padStart(2,'0');
 $('statusTime').textContent=time;
 $('lock').querySelector('.time').textContent=time;
 const midnight=storyClockMinute>=24*60;
 const day=midnight?8:7;
 const weekday=midnight?'星期日':'星期六';
 $('lock').querySelector('.date').textContent='11月'+day+'日 '+weekday;
 $('home').querySelector('.calendar .day').textContent=weekday;
 $('home').querySelector('.calendar .num').textContent=String(day);
 document.querySelectorAll('[data-story-calendar-weekday]').forEach(node=>node.textContent=weekday);
 document.querySelectorAll('[data-story-calendar-day]').forEach(node=>node.textContent=String(day));
 document.title='11月'+day+'日 '+time+' · 手机模拟器';
}
function setStoryClockStage(stage){
 const stages=Object.keys(storyClockStages);
 if(stages.indexOf(stage)<=stages.indexOf(storyClockStage))return;
 startStoryClock();
 storyClockStage=stage;
 storyClockMinute=storyClockStages[stage].minute;
 storyClockChangedAt=performance.now();
 paintStoryClock();
}
function tickStoryClock(){
 if(!storyClockStarted)return;
 const stage=storyClockStages[storyClockStage];
 const elapsed=Math.max(0,performance.now()-storyClockChangedAt);
 const minute=Math.min(stage.ceiling,stage.minute+Math.floor(elapsed/stage.tickMs));
 if(minute===storyClockMinute)return;
 storyClockMinute=minute;
 paintStoryClock();
 if(storyClockStage==='musicOpened' && storyClockMinute===23*60+57)deliverOwnerSMS();
}
paintStoryClock();
setInterval(tickStoryClock,1000);
document.addEventListener('visibilitychange',tickStoryClock);
document.addEventListener('pointerdown',startStoryClock,{capture:true,once:true});
document.addEventListener('keydown',startStoryClock,{capture:true,once:true});
</script>

<script>
const wcBirthdayWishes = [];
const wcBirthdayReceived = new Map();
let wcBirthdayStarted = false;
function wcUnreadCount(contact){
 const birthdayCount=wcBirthdayReceived.get(contact)?.unread || 0;
 return birthdayCount+(contact.name==='🐷' && pigMessageDelivered && !pigMessageRead ? 1 : 0);
}
const wcBeforeBirthdayRender=renderChatMessages;
renderChatMessages=function(contact){
 wcBeforeBirthdayRender(contact);
 const received=wcBirthdayReceived.get(contact);
 if(!received || activeChat!==contact.name)return;
 const body=$('wechat').querySelector('.wc-chatbody');
 if(!body)return;
 received.unread=0;
 body.insertAdjacentHTML('beforeend','<div class="wc-group-stamp">11月8日 00:00</div>'+received.messages.map(message=>{
  const sender=message.speaker ? contact.members.find(person=>person.name===message.speaker) : contact;
  const content=message.image
   ? '<img class="wc-chat-photo" src="'+escapeChat(message.image)+'" alt="'+escapeChat(message.text)+'">'
   : '<div class="wc-bubble">'+escapeChat(message.text).replace(/\n/g,'<br>')+'</div>';
  return '<div class="wc-message wc-group-message">'+wcAvatar(sender)+'<div class="wc-group-copy">'+(contact.isGroup ? '<span class="wc-group-sender">'+escapeChat(sender.name)+'</span>' : '')+content+'</div></div>';
 }).join(''));
 body.scrollTop=body.scrollHeight;
};
function startBirthdayNotifications(){
 if(wcBirthdayStarted)return;
 wcBirthdayStarted=true;
 const queue=wcBirthdayWishes.flatMap(wish=>wish.messages.map(message=>({contact:wcContacts.find(contact=>contact.name===wish.name),...(typeof message==='string' ? {text:message} : message)})));
 document.querySelectorAll('.message-banner').forEach(banner=>banner.remove());
 let banner;
 let index=0;
 function deliverNext(){
  if(index===queue.length){banner?.remove();showBirthdayWritingInterlude();return;}
  const {contact,...message}=queue[index++];
  const text=(contact.isGroup ? message.speaker+'：' : '')+(message.image ? '[图片]' : message.text);
  const received=wcBirthdayReceived.get(contact) || {messages:[],unread:0};
  received.messages.push(message);
  const inChat=activeChat===contact.name && !$('wechat').classList.contains('hidden');
  if(!inChat)received.unread++;
  wcBirthdayReceived.set(contact,received);
  wcRecordActivity(contact);
  if(inChat)renderChatMessages(contact);
  wcRefreshList();
  const previous=banner;
  previous?.removeAttribute('id');
  if(previous)previous.style.pointerEvents='none';
  banner=document.createElement('button');
  banner.id='birthdayNotification';
  banner.className='message-banner birthday-notification';
  banner.style.zIndex=30+index;
  banner.setAttribute('aria-label','微信，'+contact.name+'：'+text+'，点击查看');
  banner.innerHTML='<span class="banner-icon">'+wcAvatar(contact)+'</span><span class="banner-copy"><span class="banner-top"><strong>'+escapeChat(contact.name)+'</strong><small>现在</small></span><span class="banner-text">'+escapeChat(text)+'</span></span>';
  banner.onclick=()=>{closeVirtualKeyboard();closeGoosePlayer();wcOpenChat(contact);};
  phoneRoot.append(banner);playMessageSound();
  const duration=reducedMotion()?0:280;
  banner.animate(
   [{transform:'translateY(calc(-100% - 70px))'},{transform:'translateY(0)'}],
   {duration,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}
  );
  setTimeout(()=>previous?.remove(),duration);
  setTimeout(deliverNext,800);
 }
 deliverNext();
}
let birthdayWritingStarted=false;
async function showBirthdayWritingInterlude(){
 if(birthdayWritingStarted)return;
 birthdayWritingStarted=true;
 closeVirtualKeyboard();
 phoneRoot.inert=true;
 const overlay=document.createElement('div');
 overlay.className='birthday-writing-interlude';
 overlay.id='birthdayWritingInterlude';
 overlay.setAttribute('role','status');
 const text=document.createElement('p');
 text.textContent='我要不要也给陈思罕写一个生日祝福……';
 overlay.append(text);
 document.body.append(overlay);
 const fade=reducedMotion()?0:600;
 await overlay.animate([{opacity:0},{opacity:1}],{duration:fade,fill:'both'}).finished.catch(()=>{});
 await text.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:fade,fill:'both'}).finished.catch(()=>{});
 await chatDelay(2400);
 ownerFreeWriting=true;
 show('simSMS');
 openSMSThread(smsThreads.indexOf(ownerSMSThread));
 await overlay.animate([{opacity:1},{opacity:0}],{duration:fade,fill:'both'}).finished.catch(()=>{});
 overlay.remove();
 phoneRoot.inert=false;
 $('ownerSMSInput')?.focus({preventScroll:true});
}
</script>

<script>
const birthdayCollectionURL='';
const birthdayOutboxKey='phone1108-birthday-outbox-v1';
let birthdayOutbox=[];
try{
 const saved=JSON.parse(junmingStorage.getItem(birthdayOutboxKey)||'[]');
 if(Array.isArray(saved))birthdayOutbox=saved.filter(row=>typeof row.id==='string'&&typeof row.text==='string'&&row.text.length<=5000);
}catch{}
let birthdayOutboxBusy=false,birthdaySaveFailed=false,birthdayRetryTimer=null;
function persistBirthdayOutbox(){
 try{junmingStorage.setItem(birthdayOutboxKey,JSON.stringify(birthdayOutbox));}catch{}
}
function queueBirthdayWish(text){
 birthdayOutbox.push({id:crypto.randomUUID(),text});
 persistBirthdayOutbox();
 flushBirthdayOutbox();
}
function paintBlessingSaveStatus(){
 const status=$('blessingSaveStatus');
 if(!status)return;
 status.replaceChildren();
 if(birthdaySaveFailed && birthdayOutbox.length){
  const retry=document.createElement('button');
  retry.type='button';
  retry.textContent='祝福还在等待保存，点此重试';
  retry.onclick=flushBirthdayOutbox;
  status.append(retry);
 }else{
  status.textContent=birthdayOutbox.length?'祝福保存中…':ownerBirthdayReplies.length?'祝福已保存':'';
 }
}
async function flushBirthdayOutbox(){
 if(birthdayOutboxBusy || !birthdayOutbox.length)return;
 birthdayOutboxBusy=true;
 birthdaySaveFailed=false;
 clearTimeout(birthdayRetryTimer);
 paintBlessingSaveStatus();
 try{
  while(birthdayOutbox.length){
   const item=birthdayOutbox[0];
   const response=await fetch(birthdayCollectionURL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(item),signal:AbortSignal.timeout(15000)
   });
   if(!response.ok || !(await response.json()).saved)throw new Error('Save unavailable');
   birthdayOutbox.shift();
   persistBirthdayOutbox();
  }
 }catch{
  birthdaySaveFailed=true;
  birthdayRetryTimer=setTimeout(flushBirthdayOutbox,30000);
 }finally{
  birthdayOutboxBusy=false;
  paintBlessingSaveStatus();
 }
}
window.addEventListener('online',flushBirthdayOutbox);
flushBirthdayOutbox();

<script>
let endingVoiceFinished=false,endingNameFinished=false,endingLetterStarted=false;
function maybeShowEndingLetter(){
 if(endingLetterStarted || !finalPigDelivered || nmAudioKind!=='endingName' || !Number.isFinite(nmSongAudio.duration) || nmSongAudio.duration<=0 || nmSongAudio.currentTime<nmSongAudio.duration/2)return;
 endingLetterStarted=true;
 closeVirtualKeyboard();
 document.querySelectorAll('.message-banner').forEach(banner=>banner.remove());
 createEndingLetter(phoneRoot,{syncAudio:nmSongAudio,onExit:()=>{wcHistoryJumpEnabled=true;wcInstallHistoryJump();}});
}
for(const event of ['timeupdate','loadedmetadata','seeked'])nmSongAudio.addEventListener(event,maybeShowEndingLetter);
nmSongAudio.addEventListener('ended',()=>{
 if(nmAudioKind!=='endingName')return;
 endingNameFinished=true;
 maybeShowEndingLetter();
});
</script>

<script>
let wcHistoryJumpEnabled=false;
function wcInstallHistoryJump(){
 const root=$('wechat');
 root.querySelector('#wcHistoryJump')?.remove();
 if(!wcHistoryJumpEnabled || !activeChat || root.classList.contains('hidden'))return;
 const body=root.querySelector('.wc-chatbody');
 if(!body || body.querySelector('.wc-member-grid'))return;
 const button=document.createElement('button');
 button.id='wcHistoryJump';button.type='button';button.className='wc-history-jump';
 button.setAttribute('aria-label','回到最早的聊天记录');
 button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M5 19l7-7 7 7"/></svg><span>最早消息</span>';
 button.onclick=()=>{closeVirtualKeyboard();body.scrollTo({top:0,behavior:reducedMotion()?'instant':'smooth'});};
 root.append(button);
}
</script>
