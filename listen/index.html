$('accept').onclick=join;$('decline').onclick=()=>{};$('replay').onclick=$('retry').onclick=$('back').onclick=reset;$('play').onclick=()=>audio.paused?audio.play().catch(()=>toast('点击重试播放')):audio.pause();$('prev').onclick=()=>{audio.currentTime=0;};$('next').onclick=()=>toast('正在一起听《距离》');$('like').onclick=()=>{const b=$('like'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'♥':'♡';};$('loop').onclick=()=>{audio.loop=!audio.loop;$('loop').setAttribute('aria-pressed',audio.loop);toast(audio.loop?'单曲循环已开启':'单曲循环已关闭');};function toast(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;scene.append(n);setTimeout(()=>n.remove(),2000);}for(const id of ['more','options','queue','chat','comment','download'])$(id).onclick=()=>toast(id==='queue'?'一起听 · 距离':id==='chat'?'正在和您的复活码是3512一起听':'一起听动画预览');reset();
